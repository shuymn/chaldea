[package]
name = "chs"
version = "0.1.0"
edition = "2024"
publish = false
description = "PTY / hooks spike harness (docs/spikes/pty-hooks-spike.md)"

# Standalone project outside any future workspace.
[workspace]

[dependencies]
portable-pty = "=0.8.1"
alacritty_terminal = "=0.26.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
uuid = { version = "=1.29.3", features = ["v4"] }
ctrlc = "=3.5.3"
httparse = "=1.10.1"
subtle = "=2.6.1"
unicode-normalization = "=0.1.26"
toml = "=1.2.2"
unicode-segmentation = "=1.13.3"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
# MasterPty returns anyhow::Error; the version portable-pty already locks.
anyhow = "=1.0.104"
windows-sys = { version = "=0.61.2", features = [
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Accessibility",
] }
