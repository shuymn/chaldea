[workspace]
members = ["crates/cli", "crates/core", "crates/daemon", "crates/pty-runtime", "crates/testkit"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shuymn/chaldea"
publish = false

# Exact pins (=x.y.z), as in spikes/pty-hooks: every upgrade is an explicit change.
[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
# `float_roundtrip`: every spelling of a decimal parses to the nearest `f64`, so equal
# command arguments share one request identity (docs/design/http-surface.md §2.8). Stated
# here: without it, only a dev-dependency (`jsonschema`) would turn it on, in tests alone.
serde_json = { version = "=1.0.154", features = ["raw_value", "float_roundtrip"] }
ts-rs = { version = "=12.0.1", features = ["no-serde-warnings", "serde-json-impl", "uuid-impl"] }
schemars = { version = "=1.2.3", features = ["raw_value", "uuid1"] }
uuid = { version = "=1.29.1", features = ["serde"] }
proptest = "=1.12.0"
# Dev only: checks that the generated JSON Schema agrees with Rust decoding. No default
# features, so no HTTP or file reference resolution.
jsonschema = { version = "=0.60.2", default-features = false }
# The headless VT of crates/pty-runtime. Its only optional feature (`serde`) is not needed.
alacritty_terminal = { version = "=0.26.0", default-features = false }
# The width table alacritty_terminal uses (same version as its lock entry), for grid decoding.
unicode-width = "=0.2.3"
# The macOS PTY backend (docs/design/pty-unix.md): rustix for safe syscalls (already in the
# lock through alacritty_terminal), libc for the pre_exec body and libproc.
rustix = { version = "=1.1.6", default-features = false, features = ["std", "pty", "process", "event", "termios", "fs"] }
libc = "=0.2.191"
# testkit's FakeCli: `flag::register` sets handlers without `unsafe`.
signal-hook = { version = "=0.4.6", default-features = false }
# The Windows ConPTY backend (docs/design/pty-windows.md §1): declarations only, already in
# the lock through winapi-util; each feature adds the declarations its comment names.
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",           # HANDLE, FILETIME, DuplicateHandle, error codes, WAIT_*
  "Win32_Security",             # gates CreateProcessW and CreateJobObjectW (SECURITY_ATTRIBUTES pointers)
  "Win32_System_Console",       # CreatePseudoConsole, ResizePseudoConsole, ClosePseudoConsole, COORD, HPCON
  "Win32_System_JobObjects",    # job create, limits, assign, terminate, accounting, pid list, IsProcessInJob
  "Win32_System_Threading",     # CreateProcessW, attribute list, OpenProcess, GetProcessTimes, waits, ResumeThread
  "Win32_System_LibraryLoader", # GetModuleHandleW, GetModuleFileNameW (the conpty_module evidence)
  "Win32_System_Pipes",         # PeekNamedPipe (test helper for CL-21)
  "Win32_Globalization",        # CompareStringOrdinal (environment key order and equality)
  "Win32_UI_Shell",             # SHGetKnownFolderPath (the default state directory, docs/design/daemon-lifecycle.md §2.4)
  "Win32_System_Com",           # CoTaskMemFree for the known-folder path
  "Win32_Security_Authorization", # GetSecurityInfo, SDDL conversions (state-directory privacy)
  "Win32_Storage_FileSystem",   # CreateDirectoryW, CreateFileW with an explicit descriptor
  "Win32_System_Registry",      # needed by SHELLEXECUTEINFOW (`chaldea open`, daemon-lifecycle.md L21)
  "Win32_System_Diagnostics_ToolHelp", # CreateToolhelp32Snapshot, Process32FirstW / NextW (the parent pid of the ancestry walk)
] }
# testkit's FakeCli on Windows: console mode and size without `unsafe` (already in the lock).
winapi-util = "=0.1.11"
# The store (docs/design/event-store.md): SQLite compiled from the bundled source, so macOS and
# Windows run the same SQLite; no default features (prepared-statement cache, wasm FFI).
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }
# Blob content addresses (mvp-design §2.1 `Content`).
sha2 = "=0.11.1"
# The store writer's reply channel and commit notifications only.
tokio = { version = "=1.54.1", default-features = false, features = ["sync"] }
# Inline `Content` with `encoding: base64` (already in the lock through alacritty_terminal).
base64 = "=0.22.1"
# Test databases in the OS temp directory (already in the lock through proptest).
tempfile = "=3.27.0"
# HTTP routing and extractors (mvp §2.5, arch §3); no defaults: no form, no json, no axum tracing, no http2.
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "ws", "query", "matched-path"] }
# The HTTP/1 connection builder with a timer, header limits, and upgrades; request parsing is hyper's.
hyper = { version = "=1.12.0", default-features = false, features = ["server", "http1"] }
# TokioIo, TokioTimer, and the tower-to-hyper service adapter for the own accept loop.
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio", "server", "http1", "service"] }
# Layer and Service for the guard.
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
# Sensitive-header marking; no TimeoutLayer, no TraceLayer, no body-limit layer.
tower-http = { version = "=0.7.1", default-features = false, features = ["sensitive-headers"] }
# Final equality of credential hashes (mvp §2.5, prior-art row 5d); same version as the spike.
subtle = "=2.6.1"
# 256-bit secrets for tokens, tickets, and pair codes from the OS CSPRNG (already in the lock through uuid).
getrandom = "=0.4.3"
# Request spans; PR 8 installs the subscriber.
tracing = "=0.1.44"
# Collecting a bounded request body under a deadline.
http-body-util = "=0.1.5"
# AbortHandle for the task registry and the split WebSocket halves (already in the lock through axum).
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
# The error type axum's WebSocket wraps, matched by type for the 1009 close (the version
# axum's `ws` feature locks; no defaults: no handshake code).
tungstenite = { version = "=0.29.0", default-features = false }
# Dev only: the WebSocket test client (the version axum's `ws` feature locks).
tokio-tungstenite = "=0.29.0"
# The daemon's log subscriber (docs/design/daemon-lifecycle.md §2.13); also the capturing
# subscriber of the secret-redaction tests.
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std"] }
# The `chaldea` CLI's argument parsing (docs/design/daemon-lifecycle.md §1); no color, no suggestions.
clap = { version = "=4.6.8", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# A pedantic subset: lints that catch real mistakes in contract code, without
# the style-only ones.
[workspace.lints.clippy]
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
checked_conversions = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
match_wildcard_for_single_variants = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
wildcard_imports = "warn"
