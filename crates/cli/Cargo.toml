[package]
name = "chaldea-cli"
description = "The `chaldea` binary: the daemon's process entry and the CLI (docs/design/daemon-lifecycle.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "chaldea"
path = "src/main.rs"

# Re-executes itself through `dispatch` with `Stall::AfterStdin` (hook-ingest §2.13).
[[test]]
name = "hook_emit_stall"
path = "tests/hook_emit_stall.rs"
harness = false

# Each is also a `chaldea` with test seams (tests/support/faults.rs), the program `daemon
# start` launches as its child, so it has its own `main` (tests/support/runner.rs).
[[test]]
name = "daemon_start"
path = "tests/daemon_start.rs"
harness = false

[[test]]
name = "daemon_stop"
path = "tests/daemon_stop.rs"
harness = false

[[test]]
name = "daemon_macos"
path = "tests/daemon_macos.rs"
harness = false

[dependencies]
chaldea-daemon = { path = "../daemon" }
# `chaldea open`'s wire types (`PairCodeResponse`, `ErrorBody`).
chaldea-core = { path = "../core" }
clap.workspace = true
serde_json.workspace = true
# `host`: the emitter's exit without exit handlers (hook-ingest §2.13), and detaching, the
# readiness channel, the stop request, and the browser launch (daemon-lifecycle §2.10, §2.13).
chaldea-pty-runtime = { path = "../pty-runtime" }
# The emitter's `emit_id` (hook-ingest §2.13) and the launchd job's label (daemon-lifecycle §2.10).
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
chaldea-daemon = { path = "../daemon" }
# The `host` test helpers (signal state, links, ACL grants, console events, the stop event).
chaldea-pty-runtime = { path = "../pty-runtime", features = ["fake"] }
tempfile.workspace = true
# Log lines with secret markers from a test component (PR8-CL-20).
tracing.workspace = true

[target.'cfg(unix)'.dev-dependencies]
# Test signals by pid.
rustix = { workspace = true }

[lints]
workspace = true
