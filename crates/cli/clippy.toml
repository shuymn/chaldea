# Every child the CLI creates goes through the daemon's spawn-lock wrapper
# (`chaldea_daemon::lifecycle::spawn_locked`) or `pty-runtime::host`, both under the spawn lock
# (docs/design/daemon-lifecycle.md §2.11).

disallowed-methods = [
  { path = "std::process::Command::spawn", reason = "spawn through spawn_locked (the spawn lock)" },
  { path = "std::process::Command::output", reason = "spawn through spawn_locked (the spawn lock)" },
  { path = "std::process::Command::status", reason = "spawn through spawn_locked (the spawn lock)" },
]
