[package]
name = "chaldea-daemon"
description = "Chaldea daemon: the SQLite event store and the HTTP server (routes, guard, tokens, task registry)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chaldea-core = { path = "../core" }
rusqlite.workspace = true
sha2.workspace = true
# The writer's reply channel (`sync`) and the HTTP server's runtime, sockets, and timers.
tokio = { workspace = true, features = ["rt", "net", "time", "macros"] }
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
# Event ids and the epoch are random v4 UUIDs.
uuid = { workspace = true, features = ["v4"] }
axum.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tower.workspace = true
tower-http.workspace = true
subtle.workspace = true
getrandom.workspace = true
tracing.workspace = true
http-body-util.workspace = true
futures-util.workspace = true
tungstenite.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
tokio-tungstenite.workspace = true
tracing-subscriber.workspace = true
# The contract fixtures validate captured bodies against packages/contracts/schema.
jsonschema.workspace = true

[lints]
workspace = true
