[package]
name = "chaldea-daemon"
description = "Chaldea daemon: the SQLite event store and the HTTP server (routes, guard, tokens, task registry)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chaldea-core = { path = "../core" }
# Process-level OS primitives (`host`) and the spawn lock (docs/design/daemon-lifecycle.md §2.2).
chaldea-pty-runtime = { path = "../pty-runtime" }
rusqlite.workspace = true
sha2.workspace = true
# The writer's reply channel (`sync`), the HTTP server's runtime, sockets, and timers, and the
# daemon's multi-thread runtime and signal listeners. Never `process` (CI checks it).
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "time", "macros", "signal"] }
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
# Event ids and the epoch are random v4 UUIDs.
uuid = { workspace = true, features = ["v4"] }
axum.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tower.workspace = true
tower-http.workspace = true
subtle.workspace = true
getrandom.workspace = true
tracing.workspace = true
http-body-util.workspace = true
futures-util.workspace = true
tungstenite.workspace = true
# The global log subscriber (docs/design/daemon-lifecycle.md §2.13).
tracing-subscriber.workspace = true

[dev-dependencies]
# The `host` test helpers (links, ACL grants, signal state).
chaldea-pty-runtime = { path = "../pty-runtime", features = ["fake"] }
proptest.workspace = true
tempfile.workspace = true
# Paused-clock tests (the runtime features are normal dependencies above).
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
# The contract fixtures validate captured bodies against packages/contracts/schema.
jsonschema.workspace = true

[lints]
workspace = true
