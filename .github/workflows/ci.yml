name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  workspace:
    name: workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup reads the channel and components from rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Includes the contract drift check (crates/core/tests/contracts_export.rs). With
      # --no-fail-fast, one failing test binary does not keep the others from running.
      - name: Run tests
        run: cargo test --workspace --locked --no-fail-fast

      # The Windows tests are compiled only on Windows: a cfg mistake that compiles a whole
      # test binary or suite out must fail here instead of passing silently. Each binary
      # must list its sentinel tests (docs/design/pty-windows.md §1, docs/design/event-store.md §7).
      - name: List the Windows tests
        if: runner.os == 'Windows'
        run: |
          require() {
            local list="$1"
            shift
            for t in "$@"; do
              grep -Fxq "$t: test" <<<"$list" || { echo "not compiled: $t"; exit 1; }
            done
          }
          list="$(cargo test -p chaldea-pty-runtime --lib --locked -- --list)"
          require "$list" \
            windows::tests::dropping_the_child_kills_through_the_job \
            windows::kill::tests::job_empty_and_handles_signalled_proves_death \
            host::windows::tests::created_entries_read_back_private \
            host::windows::tests::stop_event_round_trip \
            windows::process::tests::wait_result_mapping
          list="$(cargo test -p chaldea-pty-runtime --test windows_spawn --locked -- --list)"
          require "$list" env_is_exactly_the_spec
          list="$(cargo test -p chaldea-pty-runtime --test process_native --locked -- --list)"
          require "$list" ancestry_of_a_grandchild_reaches_this_process
          list="$(cargo test -p chaldea-testkit --test pty_windows --locked -- --list)"
          require "$list" spawn_tree_dies_and_unrelated_survives
          list="$(cargo test -p chaldea-daemon --test store_open --locked -- --list)"
          require "$list" long_path_vfs_is_selected
          list="$(cargo test -p chaldea-daemon --lib --locked -- --list)"
          require "$list" \
            lifecycle::tests::state_dir::refuses_users_ace_under_profile \
            lifecycle::tests::state_dir::creates_a_state_dir_beyond_max_path \
            lifecycle::tests::state_dir::refuses_verbatim_path_with_parent_component \
            lifecycle::tests::files::refuses_reparse_point \
            lifecycle::tests::shutdown::record_removal_failure_is_reported
          list="$(cargo test -p chaldea-cli --test daemon_windows --locked -- --list)"
          require "$list" ctrl_c_and_ctrl_break_stop stop_event_is_global \
            setup_without_console_can_start_and_stop

      # core is Sans-IO: no async runtime, store, HTTP stack, or random source in its
      # dependency tree (core::auth and core::http are pure policy and wire types).
      # A here-string, not a pipe: under `bash -eo pipefail`, `grep -q` exiting on the
      # first match makes the writer die of SIGPIPE, and the negated pipeline would pass.
      - name: Check core dependencies
        run: |
          deps="$(cargo tree -p chaldea-core -e normal --prefix none)"
          ! grep -Eq '^(tokio|rusqlite|axum|hyper|tower|getrandom) ' <<<"$deps"

      # pty-runtime is synchronous: std threads and blocking I/O, no async runtime.
      - name: Check pty-runtime dependencies
        run: |
          deps="$(cargo tree -p chaldea-pty-runtime -e normal --prefix none)"
          ! grep -Eq '^tokio ' <<<"$deps"

      # Every child goes through the spawn lock: tokio's `process` feature stays off in the
      # daemon (docs/design/daemon-lifecycle.md §2.11).
      - name: Check the daemon's tokio features
        run: |
          feats="$(cargo tree -p chaldea-daemon -e features --prefix none -i tokio)"
          ! grep -q '^tokio feature "process"' <<<"$feats"

      # The daemon's own build (no dev-dependencies) parses decimals with serde_json's
      # `float_roundtrip`, which command request identity relies on (http-surface §2.8).
      - name: Check serde_json features
        run: |
          deps="$(cargo tree -p chaldea-daemon -e normal,features --prefix none)"
          grep -Fxq 'serde_json feature "float_roundtrip"' <<<"$deps"

      # testkit may depend on no workspace crate other than core (mvp-design §3).
      - name: Check testkit dependencies
        run: |
          deps="$(cargo tree -p chaldea-testkit -e normal --target all --prefix none)"
          bad="$(awk '/^chaldea-/ && !/^chaldea-(testkit|core) /' <<<"$deps")"
          [ -z "$bad" ] || { echo "testkit depends on: $bad"; exit 1; }

  # The Quint specs (docs/design/formal-specs.md): typecheck, seeded simulation of every
  # invariant, and the check that specs/traces/ equals what the spec exports. The traces
  # are replayed against core by the workspace job's tests, which need no Node.
  specs:
    name: specs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.10.17
          install: false
          cache: false

      # Only Node and pnpm: Quint comes from specs/pnpm-lock.yaml.
      - name: Install Node and pnpm
        env:
          MISE_YES: 1
        run: |
          mise trust mise.toml >/dev/null
          mise install --locked node pnpm

      # specs/pnpm-workspace.yaml denies every dependency build script.
      - name: Install Quint
        working-directory: specs
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: specs
        run: mise exec -- pnpm run typecheck

      - name: Simulate
        working-directory: specs
        run: mise exec -- pnpm run simulate

      - name: Check traces
        working-directory: specs
        run: mise exec -- pnpm run traces:check

  pty-hooks:
    name: pty-hooks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: spikes/pty-hooks
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup reads the channel and components from rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked
