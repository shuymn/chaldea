name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  workspace:
    name: workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup reads the channel and components from rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # jq for the probe below, pinned in mise.lock.
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.10.17
          install: false
          cache: false

      - name: Install jq
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
          MISE_YES: 1
        run: |
          mise trust mise.toml >/dev/null
          mise install --locked jq

      # See docs/design/deadlines.md §3 D4. Reuses the clippy step's check artifacts.
      - name: Probe the timer ban
        run: mise exec jq -- bash scripts/lint-probe.sh

      # cargo puts the processes of `cargo test` in a kill-on-close job of its own that allows
      # no breakaway, and this runner's own job allows none either, so a `daemon start` under
      # either is refused by design (docs/design/daemon-lifecycle.md §2.12 A-W1, §7). The tests
      # that need a successful detached start run from a wrapper started through WMI outside
      # any job; the script fails the step if that wrapper is in a job, fails a profile or
      # access check, or a selected test did not run and pass by name. It runs first, and the
      # rest of the tests run even when it fails.
      - name: Run the detached-start tests outside any job (WMI)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 25
        run: ./scripts/windows-tests.ps1 -Lane Wmi -TimeoutMinutes 15

      # Includes the contract drift check (crates/core/tests/contracts_export.rs). With
      # --no-fail-fast, one failing test binary does not keep the others from running.
      - name: Run tests
        if: runner.os != 'Windows'
        run: cargo test --workspace --locked --no-fail-fast

      # SF-4 (docs/design/stop-facts.md §6): the published positions' stress test, ignored by
      # default, runs where loads and stores can reorder (macOS arm64).
      - name: Stress the published positions (macOS)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: cargo test -p chaldea-pty-runtime --lib --locked -- --ignored --exact writer::tests::published_positions_stress

      # Every test except those of the WMI step above.
      - name: Run tests (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: ./scripts/windows-tests.ps1 -Lane Cargo

      # The run above captures passing tests' output: this prints the per-OS B-8
      # observations of the in-flight-body cases (B8-OBSERVED lines; docs/design/hook-ingest.md §7.1).
      - name: Show the B-8 observations
        run: cargo test -p chaldea-daemon --test hook_b8 --locked -- observed_ --show-output

      # The Windows tests are compiled only on Windows: a cfg mistake that compiles a whole
      # test binary or suite out must fail here instead of passing silently. Each binary
      # must list its sentinel tests (docs/design/pty-windows.md §1, docs/design/event-store.md §7).
      - name: List the Windows tests
        if: runner.os == 'Windows'
        run: |
          require() {
            local list="$1"
            shift
            for t in "$@"; do
              grep -Fxq "$t: test" <<<"$list" || { echo "not compiled: $t"; exit 1; }
            done
          }
          list="$(cargo test -p chaldea-pty-runtime --lib --locked -- --list)"
          require "$list" \
            host::windows::tests::runner_can_break_away \
            windows::tests::dropping_the_child_kills_through_the_job \
            windows::kill::tests::job_empty_and_handles_signalled_proves_death \
            host::windows::tests::created_entries_read_back_private \
            host::windows::tests::stop_event_round_trip \
            host::windows::tests::job_state_reads_the_immediate_job \
            windows::process::tests::wait_result_mapping
          list="$(cargo test -p chaldea-pty-runtime --test windows_spawn --locked -- --list)"
          require "$list" env_is_exactly_the_spec
          list="$(cargo test -p chaldea-pty-runtime --test process_native --locked -- --list)"
          require "$list" ancestry_of_a_grandchild_reaches_this_process
          list="$(cargo test -p chaldea-testkit --test pty_windows --locked -- --list)"
          require "$list" spawn_tree_dies_and_unrelated_survives
          list="$(cargo test -p chaldea-daemon --test store_open --locked -- --list)"
          require "$list" long_path_vfs_is_selected
          list="$(cargo test -p chaldea-daemon --lib --locked -- --list)"
          require "$list" \
            lifecycle::tests::state_dir::refuses_users_ace_under_profile \
            lifecycle::tests::state_dir::creates_a_state_dir_beyond_max_path \
            lifecycle::tests::state_dir::refuses_verbatim_path_with_parent_component \
            lifecycle::tests::files::refuses_reparse_point \
            lifecycle::tests::shutdown::record_removal_failure_is_reported
          list="$(cargo test -p chaldea-cli --test daemon_windows --locked -- --list)"
          require "$list" ctrl_c_and_ctrl_break_stop stop_event_is_global \
            setup_without_console_can_start_and_stop \
            start_breaks_away_from_a_kill_on_close_job_with_breakaway \
            start_breaks_away_from_a_kill_on_close_job_with_silent_breakaway \
            start_refuses_a_job_without_breakaway child_rejects_any_job \
            nested_outer_job_refuses foreground_in_a_job_warns detached_child_has_no_console \
            no_listener_is_reported daemon_holds_no_caller_handle

      # core is Sans-IO: no async runtime, store, HTTP stack, or random source in its
      # dependency tree (core::auth and core::http are pure policy and wire types).
      # A here-string, not a pipe: under `bash -eo pipefail`, `grep -q` exiting on the
      # first match makes the writer die of SIGPIPE, and the negated pipeline would pass.
      - name: Check core dependencies
        run: |
          deps="$(cargo tree -p chaldea-core -e normal --prefix none)"
          ! grep -Eq '^(tokio|rusqlite|axum|hyper|tower|getrandom) ' <<<"$deps"

      # pty-runtime is synchronous: std threads and blocking I/O, no async runtime.
      - name: Check pty-runtime dependencies
        run: |
          deps="$(cargo tree -p chaldea-pty-runtime -e normal --prefix none)"
          ! grep -Eq '^tokio ' <<<"$deps"

      # Every child goes through the spawn lock: tokio's `process` feature stays off in the
      # daemon (docs/design/daemon-lifecycle.md §2.11).
      - name: Check the daemon's tokio features
        run: |
          feats="$(cargo tree -p chaldea-daemon -e features --prefix none -i tokio)"
          ! grep -q '^tokio feature "process"' <<<"$feats"

      # The daemon's own build (no dev-dependencies) parses decimals with serde_json's
      # `float_roundtrip`, which command request identity relies on (http-surface §2.8).
      - name: Check serde_json features
        run: |
          deps="$(cargo tree -p chaldea-daemon -e normal,features --prefix none)"
          grep -Fxq 'serde_json feature "float_roundtrip"' <<<"$deps"

      # testkit may depend on no workspace crate other than core (mvp-design §3).
      - name: Check testkit dependencies
        run: |
          deps="$(cargo tree -p chaldea-testkit -e normal --target all --prefix none)"
          bad="$(awk '/^chaldea-/ && !/^chaldea-(testkit|core) /' <<<"$deps")"
          [ -z "$bad" ] || { echo "testkit depends on: $bad"; exit 1; }

  # Whether the release smoke runs (docs/design/w1-pwa.md §2.1 "Release"): on every push to
  # main and manual run, and on pull requests that change more than docs. The web job's
  # release build and Playwright run regardless.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      release: ${{ steps.filter.outputs.release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Docs-only pull requests skip the release smoke; any other change runs it (every Rust,
      # Cargo, toolchain, web, pnpm, mise, script, or workflow input of the release binary).
      # `--no-renames` lists a rename as its deletion and its addition, so both sides count.
      - name: Filter the changed paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            release=true
            why="a $EVENT run"
          else
            files="$(git diff --no-renames --name-only "$BASE...$HEAD")"
            others="$(grep -Ev '^(docs/|LICENSE-|[^/]+\.md$)' <<<"$files" || true)"
            if [ -n "$others" ]; then
              release=true
              why="$(wc -l <<<"$others" | tr -d ' ') changed paths outside the docs, first: $(head -n 1 <<<"$others")"
            else
              release=false
              why="only docs changed"
            fi
          fi
          echo "release=$release" >>"$GITHUB_OUTPUT"
          echo "release smoke: $release ($why)" | tee -a "$GITHUB_STEP_SUMMARY"

  # The PWA's packages (docs/design/w1-pwa.md §3 D8): the validator codegen, typecheck, and
  # Vitest of packages/contracts and packages/web, the Vite build, the release command, and
  # Playwright (Chromium and WebKit) against that release binary; then, when `changes` says
  # so, the release smoke. The golden cases they read are owned by the workspace job's tests.
  web:
    name: web
    needs: changes
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.10.17
          install: false
          cache: false

      - name: Install Node and pnpm
        env:
          MISE_YES: 1
        run: |
          mise trust mise.toml >/dev/null
          mise install --locked node pnpm

      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      # `check` runs the codegen once, then typecheck and Vitest.
      - name: Codegen, typecheck, and test
        working-directory: packages/contracts
        run: mise exec -- pnpm run check

      # The web app's `check`: codegen, typecheck, Vitest, then the Vite build into dist/.
      - name: Typecheck, test, and build the web app
        working-directory: packages/web
        run: mise exec -- pnpm run check

      # rustup reads the channel and components from rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      # The daemon's build.rs embeds dist/ and fails on a file it does not allow. The task
      # needs only Node and pnpm, installed above.
      - name: Build the release chaldea (mise run release)
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run release

      # The browsers of the pinned @playwright/test.
      - name: Install the Playwright browsers
        working-directory: packages/web
        run: mise exec -- pnpm exec playwright install chromium webkit

      # Its global setup builds FakeCli; the release chaldea is already built.
      - name: Run Playwright
        working-directory: packages/web
        run: mise exec -- pnpm run e2e

      # The smoke's own failure paths: its asset list, a binary that cannot start, a daemon
      # that ignores `daemon stop`.
      - name: Test the release smoke
        if: needs.changes.outputs.release == 'true'
        run: mise exec -- node --test scripts/release-smoke.test.mjs

      # Last: it rebuilds chaldea without the web app.
      - name: Smoke the release binary
        if: needs.changes.outputs.release == 'true'
        run: mise exec -- node scripts/release-smoke.mjs

  # The release smoke on Windows (docs/design/w1-pwa.md §2.1 "Release").
  web-smoke:
    name: web-smoke
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.10.17
          install: false
          cache: false

      - name: Install Node and pnpm
        env:
          MISE_YES: 1
        run: |
          mise trust mise.toml >/dev/null
          mise install --locked node pnpm

      # rustup reads the channel and components from rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Build the release chaldea (mise run release)
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run release

      - name: Smoke the release binary
        run: mise exec -- node scripts/release-smoke.mjs

  # The Quint specs (docs/design/formal-specs.md): typecheck, seeded simulation of every
  # invariant, and the check that specs/traces/ equals what the spec exports. The traces
  # are replayed against core by the workspace job's tests, which need no Node.
  specs:
    name: specs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.10.17
          install: false
          cache: false

      # Only Node and pnpm: Quint comes from specs/pnpm-lock.yaml.
      - name: Install Node and pnpm
        env:
          MISE_YES: 1
        run: |
          mise trust mise.toml >/dev/null
          mise install --locked node pnpm

      # specs/pnpm-workspace.yaml denies every dependency build script.
      - name: Install Quint
        working-directory: specs
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: specs
        run: mise exec -- pnpm run typecheck

      - name: Simulate
        working-directory: specs
        run: mise exec -- pnpm run simulate

      - name: Check traces
        working-directory: specs
        run: mise exec -- pnpm run traces:check
