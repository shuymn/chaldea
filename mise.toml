# Each tool tracks its major version; mise.lock pins the exact versions and
# checksums, and .github/workflows/mise-update.yml advances it.
[tools]
"github:babarot/gh-infra" = "0"
lefthook = "2"
# Linters the shared security and gha workflows also run; the git hooks use
# these so local checks match CI.
actionlint = "1"
betterleaks = "1"
ghalint = "1"
# Run the Quint specs under specs/ (docs/design/formal-specs.md); Quint itself is
# pinned in specs/package.json and specs/pnpm-lock.yaml.
node = "24"
pnpm = "12"

# Rust is not listed: rust-toolchain.toml pins it, and rustup reads that file
# directly.

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64", "windows-x64"]
locked = true
# Matches the minimumReleaseAge of the shared Renovate preset.
minimum_release_age = "3d"
