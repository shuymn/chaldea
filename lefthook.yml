# The same checks CI runs: the workflow linters of the shared gha workflow, the
# secret scan of the shared security workflow, and the pty-hooks spike checks
# of ci.yml (tests on push, since they take several seconds).
pre-commit:
  commands:
    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: mise exec -- actionlint {staged_files}
    ghalint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: mise exec -- ghalint run
    betterleaks:
      run: mise exec -- betterleaks git --pre-commit --staged --redact --no-banner --verbose --validation=false
    pty-hooks-fmt:
      root: spikes/pty-hooks/
      glob: "*.rs"
      run: cargo fmt --check
    pty-hooks-clippy:
      root: spikes/pty-hooks/
      glob: "*.{rs,toml,lock}"
      run: cargo clippy --locked --all-targets -- -D warnings

pre-push:
  commands:
    pty-hooks-test:
      root: spikes/pty-hooks/
      glob: "*.{rs,toml,lock,txt}"
      run: cargo test --locked
