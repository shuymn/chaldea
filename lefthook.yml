# The same checks CI runs: the workflow linters of the shared gha workflow, the
# secret scan of the shared security workflow, and the workspace and specs checks
# of ci.yml (tests and the specs simulation on push, since they take several
# seconds).
pre-commit:
  commands:
    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: mise exec -- actionlint {staged_files}
    ghalint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: mise exec -- ghalint run
    betterleaks:
      run: mise exec -- betterleaks git --pre-commit --staged --redact --no-banner --verbose --validation=false
    workspace-fmt:
      glob: "crates/**/*.rs"
      run: cargo fmt --all --check
    workspace-clippy:
      glob:
        - "crates/**/*.{rs,toml}"
        - "Cargo.{toml,lock}"
        - "rust-toolchain.toml"
      run: cargo clippy --workspace --all-targets --locked -- -D warnings
    # The daemon's timer bans fire (docs/design/deadlines.md §3 D4).
    daemon-lint-probe:
      glob:
        - "crates/daemon/clippy.toml"
        - "crates/daemon/Cargo.toml"
        - "crates/daemon/tests/lint_probe.rs"
        - "scripts/lint-probe.sh"
        - "Cargo.{toml,lock}"
        - "rust-toolchain.toml"
      run: ./scripts/lint-probe.sh
    # core is Sans-IO: no async runtime, store, HTTP stack, or random source. Without
    # pipefail the pipeline's status is grep's, so an early grep exit cannot pass it.
    core-deps:
      glob:
        - "crates/**/Cargo.toml"
        - "Cargo.{toml,lock}"
      run: deps="$(cargo tree -p chaldea-core -e normal --prefix none)" && ! printf '%s\n' "$deps" | grep -Eq '^(tokio|rusqlite|axum|hyper|tower|getrandom) '
    # pty-runtime is synchronous: no async runtime in its dependency tree. Without
    # pipefail the pipeline's status is grep's, so an early grep exit cannot pass it.
    pty-runtime-deps:
      glob:
        - "crates/**/Cargo.toml"
        - "Cargo.{toml,lock}"
      run: deps="$(cargo tree -p chaldea-pty-runtime -e normal --prefix none)" && ! printf '%s\n' "$deps" | grep -Eq '^tokio '
    # tokio's `process` feature stays off in the daemon (every child goes through the spawn
    # lock). Without pipefail the pipeline's status is grep's, so an early grep exit cannot
    # pass it.
    daemon-tokio-features:
      glob:
        - "crates/**/Cargo.toml"
        - "Cargo.{toml,lock}"
      run: feats="$(cargo tree -p chaldea-daemon -e features --prefix none -i tokio)" && ! printf '%s\n' "$feats" | grep -q '^tokio feature "process"'
    # The daemon's own build parses decimals with serde_json's `float_roundtrip`, which
    # command request identity relies on.
    serde-json-features:
      glob:
        - "crates/**/Cargo.toml"
        - "Cargo.{toml,lock}"
      run: deps="$(cargo tree -p chaldea-daemon -e normal,features --prefix none)" && printf '%s\n' "$deps" | grep -Fxq 'serde_json feature "float_roundtrip"'
    # testkit may depend on no workspace crate other than core.
    testkit-deps:
      glob:
        - "crates/**/Cargo.toml"
        - "Cargo.{toml,lock}"
      run: deps="$(cargo tree -p chaldea-testkit -e normal --target all --prefix none)" && bad="$(printf '%s\n' "$deps" | awk '/^chaldea-/ && !/^chaldea-(testkit|core) /')" && [ -z "$bad" ]
    # specs/ checks (docs/design/formal-specs.md). Globs are repository-relative; `root`
    # only sets the working directory. The frozen install comes first (pnpm skips it when
    # node_modules is up to date), so every run uses the pinned Quint.
    specs-check:
      root: specs/
      glob:
        - "specs/*.qnt"
        - "specs/traces/**"
        - "specs/scripts/*"
        - "specs/package.json"
        - "specs/pnpm-*.yaml"
      run: 'mise exec -- pnpm install --frozen-lockfile --silent && mise exec -- pnpm run --silent typecheck && mise exec -- pnpm run --silent traces:check'

pre-push:
  commands:
    workspace-test:
      glob:
        - "crates/**/*"
        - "packages/contracts/**/*"
        - "specs/traces/**"
        - "Cargo.{toml,lock}"
        - "rust-toolchain.toml"
      run: cargo test --workspace --locked --no-fail-fast
    specs-simulate:
      root: specs/
      glob:
        - "specs/*.qnt"
        - "specs/scripts/*"
        - "specs/package.json"
        - "specs/pnpm-*.yaml"
      run: 'mise exec -- pnpm install --frozen-lockfile --silent && mise exec -- pnpm run --silent simulate'
