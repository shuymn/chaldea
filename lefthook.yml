# The same checks CI runs: the workflow linters of the shared gha workflow, the
# secret scan of the shared security workflow, and the workspace, specs, and
# pty-hooks spike checks of ci.yml (tests and the specs simulation on push, since
# they take several seconds).
pre-commit:
  commands:
    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: mise exec -- actionlint {staged_files}
    ghalint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: mise exec -- ghalint run
    betterleaks:
      run: mise exec -- betterleaks git --pre-commit --staged --redact --no-banner --verbose --validation=false
    workspace-fmt:
      glob: "crates/**/*.rs"
      run: cargo fmt --all --check
    workspace-clippy:
      glob:
        - "crates/**/*.{rs,toml}"
        - "Cargo.{toml,lock}"
        - "rust-toolchain.toml"
      run: cargo clippy --workspace --all-targets --locked -- -D warnings
    # pty-runtime is synchronous: no async runtime in its dependency tree. Without
    # pipefail the pipeline's status is grep's, so an early grep exit cannot pass it.
    pty-runtime-deps:
      glob:
        - "crates/**/Cargo.toml"
        - "Cargo.{toml,lock}"
      run: deps="$(cargo tree -p chaldea-pty-runtime -e normal --prefix none)" && ! printf '%s\n' "$deps" | grep -Eq '^tokio '
    # testkit may depend on no workspace crate other than core.
    testkit-deps:
      glob:
        - "crates/**/Cargo.toml"
        - "Cargo.{toml,lock}"
      run: deps="$(cargo tree -p chaldea-testkit -e normal --target all --prefix none)" && bad="$(printf '%s\n' "$deps" | awk '/^chaldea-/ && !/^chaldea-(testkit|core) /')" && [ -z "$bad" ]
    # specs/ checks (docs/design/formal-specs.md). Globs are repository-relative; `root`
    # only sets the working directory. The frozen install comes first (pnpm skips it when
    # node_modules is up to date), so every run uses the pinned Quint.
    specs-check:
      root: specs/
      glob:
        - "specs/*.qnt"
        - "specs/traces/*"
        - "specs/traces/*/*"
        - "specs/scripts/*"
        - "specs/package.json"
        - "specs/pnpm-*.yaml"
      run: 'mise exec -- pnpm install --frozen-lockfile --silent && mise exec -- pnpm run --silent typecheck && mise exec -- pnpm run --silent traces:check'
    pty-hooks-fmt:
      root: spikes/pty-hooks/
      glob: "*.rs"
      run: cargo fmt --check
    pty-hooks-clippy:
      root: spikes/pty-hooks/
      glob: "*.{rs,toml,lock}"
      run: cargo clippy --locked --all-targets -- -D warnings

pre-push:
  commands:
    workspace-test:
      glob:
        - "crates/**/*"
        - "packages/contracts/**/*"
        - "specs/traces/*"
        - "specs/traces/*/*"
        - "Cargo.{toml,lock}"
        - "rust-toolchain.toml"
      run: cargo test --workspace --locked --no-fail-fast
    specs-simulate:
      root: specs/
      glob:
        - "specs/*.qnt"
        - "specs/scripts/*"
        - "specs/package.json"
        - "specs/pnpm-*.yaml"
      run: 'mise exec -- pnpm install --frozen-lockfile --silent && mise exec -- pnpm run --silent simulate'
    pty-hooks-test:
      root: spikes/pty-hooks/
      glob: "*.{rs,toml,lock,txt}"
      run: cargo test --locked
